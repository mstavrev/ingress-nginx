name: Publish images

on:
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  publish:
    if: github.actor == 'mstavrev'
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io/${{ vars.DOCKER_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PERSONAL_TOKEN }}

      - name: Build and publish NGINX image
        run: make -C images/nginx push

      - name: Build and publish controller images
        run: make release
