name: Publish images

on:
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  publish:
    if: github.actor == 'mstavrev'
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io/${{ vars.DOCKER_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PERSONAL_TOKEN }}

      - name: Build and publish NGINX image
        run: make -C images/nginx push

      - name: Build and publish controller images
        run: make release
